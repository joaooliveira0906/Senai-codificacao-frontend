<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>

<body>

    <h1>Mini Loja</h1>

    <main>

        <section id="produtos">

            <h2>Produtos</h2>

            <article>

                <h3>iPhone 17 Pro Max</h3>

                <p>
                    iPhone 17 Pro Max 256GB com tela Super Retina XDR de 6,9", câmera tripla de 48 MP e acabamento na cor Laranja-cósmico.
                </p>

                <img src="iphone17.jpg"
                     alt="iPhone 17 Pro Max na cor Laranja-cósmico com três câmeras traseiras."
                     width="250"
                     height="250"
                     loading="lazy">

                <p><strong>Preço:</strong> R$ 11.990,00</p>

            </article>

            <article>

                <h3>Camiseta</h3>

                <figure>
                    <img src="camisa.jpg"
                         alt="Camiseta branca de algodão com gola redonda."
                         width="250"
                         height="250"
                         loading="lazy">

                    <figcaption>Camiseta branca - R$ 59,90</figcaption>
                </figure>

            </article>

        </section>

        <section>

            <h2>Vídeo do produto</h2>

            <video controls width="400" preload="metadata">
                <source src="video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>

        </section>

        <section>

            <h2>Descrição em áudio</h2>

            <audio controls preload="metadata">
                <source src="img/descricao-produto.mp3" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>

        </section>

        <section>

            <h2>Conteúdo externo</h2>

            <iframe
                src="https://www.youtube.com/embed/a4cA0ET9DRY"
                width="400"
                height="225"
                title="Vídeo externo sobre tecnologia"
                loading="lazy"
                denyfullscreen>
            </iframe>

        </section>

    </main>

    <footer>
        <p>Desenvolvido por: João Vitor</p>
    </footer>

</body>
</html>
